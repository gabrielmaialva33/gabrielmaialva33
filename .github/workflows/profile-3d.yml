name: Refresh 3D Contribution Calendar

on:
  workflow_dispatch:
  schedule:
    # Monday at 00:53 in America/Sao_Paulo (03:53 UTC).
    - cron: "53 3 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-readme-writes
  cancel-in-progress: false

jobs:
  generate:
    name: Generate the published 3D calendar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate contribution calendars
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: "250"

      - name: Keep only the published variant
        shell: bash
        run: |
          find profile-3d-contrib -maxdepth 1 -type f \
            ! -name 'profile-night-rainbow.svg' -delete

      - name: Commit the refreshed calendar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-3d-contrib/profile-night-rainbow.svg

          if git diff --cached --quiet; then
            echo "The published calendar is already current."
            exit 0
          fi

          git commit -m "chore(profile): refresh 3D contributions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Refresh Contribution Snake

on:
  workflow_dispatch:
  schedule:
    # Monday at 01:17 in America/Sao_Paulo (04:17 UTC).
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish the snake assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7aa2f7&color_dots=#1a1b27,#414868,#7aa2f7,#bb9af7,#f7768e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish assets to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

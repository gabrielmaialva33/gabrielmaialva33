name: Validate Profile Repository

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - ".gitattributes"
      - ".github/**"
      - "profile-3d-contrib/**"
  push:
    branches:
      - master
    paths:
      - "README.md"
      - ".gitattributes"
      - ".github/**"
      - "profile-3d-contrib/**"

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate README and workflow hardening
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca -color

      - name: Run repository-local checks
        run: python3 .github/scripts/validate_profile.py
